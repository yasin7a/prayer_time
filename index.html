<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Salah Reminder</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/icons/logo.svg" />
  </head>
  <body>
    <header class="app-header">
      <img
        id="app-logo"
        src="assets/icons/logo.svg"
        alt="Salah Reminder logo"
      />
      <h1 class="title">Salah Reminder</h1>
    </header>
    <main class="container">
      <ul class="prayer-list">
        <li class="prayer-row">
          <span class="prayer-name">Fajr</span
          ><button class="btn" data-prayer="Fajr">Reminder</button>
        </li>
        <li class="prayer-row">
          <span class="prayer-name">Dhuhr</span
          ><button class="btn" data-prayer="Dhuhr">Reminder</button>
        </li>
        <li class="prayer-row">
          <span class="prayer-name">Asr</span
          ><button class="btn" data-prayer="Asr">Reminder</button>
        </li>
        <li class="prayer-row">
          <span class="prayer-name">Maghrib</span
          ><button class="btn" data-prayer="Maghrib">Reminder</button>
        </li>
        <li class="prayer-row">
          <span class="prayer-name">Isha</span
          ><button class="btn" data-prayer="Isha">Reminder</button>
        </li>
      </ul>
      <section class="settings-panel" aria-label="App settings">
        <h2 class="section-title">App Settings</h2>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="toggle-reminders" />
            Enable reminders
          </label>
        </div>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="toggle-sound" />
            Notification sound
          </label>
        </div>
        <div class="setting-row">
          <label>
            <input type="checkbox" id="toggle-compact" />
            Compact mode
          </label>
        </div>
        <p class="settings-note">
          Settings are saved locally and remembered each time you open the app.
        </p>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
