<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Salah Reminder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="title">Salah Reminder</h1>

      <ul class="prayer-list">
        <li class="prayer-row">
          <span class="prayer-name">Fajr</span
          ><button class="btn" data-prayer="Fajr">Reminder</button>
        </li>
        <li class="prayer-row">
          <span class="prayer-name">Dhuhr</span
          ><button class="btn" data-prayer="Dhuhr">Reminder</button>
        </li>
        <li class="prayer-row">
          <span class="prayer-name">Asr</span
          ><button class="btn" data-prayer="Asr">Reminder</button>
        </li>
        <li class="prayer-row">
          <span class="prayer-name">Maghrib</span
          ><button class="btn" data-prayer="Maghrib">Reminder</button>
        </li>
        <li class="prayer-row">
          <span class="prayer-name">Isha</span
          ><button class="btn" data-prayer="Isha">Reminder</button>
        </li>
      </ul>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
