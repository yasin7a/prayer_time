<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Prayer Reminder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="modal-shell">
      <div class="popup-card">
        <p class="eyebrow subtle">Prayer reminder</p>
        <h1 id="question-text">Did you pray?</h1>
        <p class="muted">This is a gentle check-in for your current prayer.</p>

        <div class="button-group modal-buttons">
          <button id="yes-button" class="primary">YES</button>
          <button id="no-button" class="secondary">NO</button>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const prayer = params.get("prayer") || "prayer";
      document.getElementById("question-text").textContent =
        `Did you complete ${prayer}?`;

      const yesButton = document.getElementById("yes-button");
      const noButton = document.getElementById("no-button");

      yesButton.addEventListener("click", () => {
        window.electronAPI.sendReminderResponse({ prayer, status: "YES" });
      });

      noButton.addEventListener("click", () => {
        window.electronAPI.sendReminderResponse({ prayer, status: "NO" });
      });
    </script>
  </body>
</html>
