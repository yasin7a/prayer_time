<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Salah Reminder</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      document.documentElement.classList.add("fonts-loading");
      document.fonts.ready.then(() => {
        document.documentElement.classList.add("fonts-loaded");
      });
    </script>
  </head>
  <body>
    <div class="app-shell">
      <main class="screen">
        <header class="topbar">
          <div>
            <p class="eyebrow">Salah Reminder</p>
            <h1 id="today-date">Loading…</h1>
          </div>
        </header>

        <section class="card overview-card">
          <div class="overview-copy">
            <p class="eyebrow">Next prayer</p>
            <h2 id="current-prayer">Loading prayer data…</h2>
            <p class="muted" id="current-time">Time will appear shortly</p>
          </div>
        </section>

        <section class="card prayer-list-card">
          <div class="card-title">
            <h3>Daily prayers</h3>
            <p class="muted">A calm overview for today</p>
          </div>
          <ul id="prayer-times" class="prayer-list"></ul>
        </section>
      </main>
    </div>

    <div class="modal-shell" id="reminder-modal">
      <div class="popup-card">
        <p class="eyebrow subtle">Prayer reminder</p>
        <h1 id="question-text">Did you complete this prayer?</h1>
        <p class="muted">
          This is a gentle reminder until you confirm your prayer.
        </p>

        <div class="button-group modal-buttons">
          <button id="modal-yes-button" class="primary">YES</button>
          <button id="modal-no-button" class="secondary">NO</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
